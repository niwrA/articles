<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1024" viewBox="0 0 1800 1024" role="img" aria-labelledby="title desc">
  <title id="title">Van AI-vraag naar maatschappelijke waarde</title>
  <desc id="desc">Drie routes van een vraag naar een antwoord staan naast de groei van het elektriciteitsgebruik van datacenters.</desc>
  <rect width="1800" height="1024" fill="#f3f2ed"/>
  <path d="M0 755 C310 655 500 850 810 735 S1350 620 1800 735 V1024 H0Z" fill="#dbe5df"/>
  <text x="110" y="150" font-family="Georgia,serif" font-size="74" font-weight="700" fill="#173b34">Van vraag naar waarde</text>
  <text x="112" y="210" font-family="Arial,sans-serif" font-size="31" fill="#526a63">Niet alleen de energie per opdracht, maar de volledige taak en haar opbrengst</text>
  <g font-family="Arial,sans-serif">
    <rect x="112" y="315" width="470" height="305" rx="24" fill="#ffffff" stroke="#cbd8d1" stroke-width="3"/>
    <text x="150" y="372" font-size="26" font-weight="700" fill="#173b34">INFORMATIEVRAAG</text>
    <circle cx="172" cy="446" r="24" fill="#778f87"/><text x="164" y="455" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="218" y="455" font-size="25" fill="#314d46">Zoeken en klikken</text>
    <circle cx="172" cy="520" r="24" fill="#778f87"/><text x="164" y="529" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="218" y="529" font-size="25" fill="#314d46">AI laat redeneren</text>
    <circle cx="172" cy="594" r="24" fill="#a86141"/><text x="164" y="603" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="218" y="603" font-size="25" fill="#314d46">Hybride route</text>
    <path d="M615 468 H790" stroke="#a86141" stroke-width="8" stroke-linecap="round"/>
    <path d="M765 444 L798 468 L765 492" fill="none" stroke="#a86141" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="623" y="431" font-size="23" font-weight="700" fill="#a86141">TAAK VOLTOOID?</text>
    <rect x="830" y="315" width="410" height="305" rx="24" fill="#173b34"/>
    <text x="870" y="372" font-size="26" font-weight="700" fill="#f6f5ef">MAATSCHAPPELIJKE</text>
    <text x="870" y="407" font-size="26" font-weight="700" fill="#f6f5ef">WAARDE</text>
    <text x="870" y="475" font-size="24" fill="#d7e4df">• bruikbare kennis</text>
    <text x="870" y="522" font-size="24" fill="#d7e4df">• vermeden uitstoot</text>
    <text x="870" y="569" font-size="24" fill="#d7e4df">• publieke capaciteit</text>
    <g transform="translate(1315 310)">
      <line x1="0" y1="310" x2="365" y2="310" stroke="#789087" stroke-width="3"/>
      <rect x="35" y="180" width="105" height="130" rx="9" fill="#769188"/>
      <rect x="220" y="15" width="105" height="295" rx="9" fill="#ba704b"/>
      <text x="87" y="158" text-anchor="middle" font-size="30" font-weight="800" fill="#173b34">415</text>
      <text x="272" y="-7" text-anchor="middle" font-size="30" font-weight="800" fill="#173b34">945</text>
      <text x="87" y="350" text-anchor="middle" font-size="22" fill="#405c54">2024</text>
      <text x="272" y="350" text-anchor="middle" font-size="22" fill="#405c54">2030</text>
      <text x="180" y="400" text-anchor="middle" font-size="20" font-weight="700" fill="#405c54">TWh · ALLE DATACENTERS</text>
    </g>
  </g>
  <text x="112" y="875" font-family="Georgia,serif" font-size="40" fill="#173b34">Hoeveel waarde krijgen we terug voor de energie die AI vraagt?</text>
  <text x="112" y="930" font-family="Arial,sans-serif" font-size="23" fill="#60736d">Gemeten gebruik · scenario’s · reboundeffect · Climate Leverage Ratio</text>
</svg>
